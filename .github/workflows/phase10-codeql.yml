name: Phase 10 — CodeQL security analysis

# Runs on reviewed source changes and can also be dispatched manually.
on:
  workflow_dispatch: {}
  push:
    branches: [ "dev" ]
    paths:
      - ".github/workflows/phase10-codeql.yml"
      - ".github/workflows/phase12-release.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "composite-builds/**"
      - "core/**"
      - "subprojects/**"
      - "tooling/**"
      - "xml/**"
      - "utilities/**"
      - "editor/**"
      - "java/**"
      - "termux/**"
      - "event/**"
      - "ui/**"
      - "**/*.kt"
      - "**/*.java"
      - "**/*.xml"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/*.proto"
      - "**/*.properties"
      - "**/*.toml"

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: phase10-codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout complete source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug app and Tooling API for analysis
        run: ./gradlew :core:app:assembleDebug :tooling:impl:build --continue --stacktrace
        env:
          ANDROIDIDE_TEST: 'true'
          TEST_TOOLING_API_IMPL: 'true'
      - name: Upload CodeQL results
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

# Review and triage findings from every completed scan; a completed scan is not proof that all findings are harmless. Findings must be reviewed,
# triaged, and fixed; a completed scan alone is not proof of security.
