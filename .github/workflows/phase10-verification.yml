name: Phase 10 — verification gate

# Intentionally manual: the owner should dispatch this only after reviewing Phase 10.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: phase10-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Static safety and manifest checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Validate Gradle wrapper and Android security invariants
        run: python3 scripts/ci/phase10_static_checks.py
      - name: Validate static-check script syntax
        run: python3 -m py_compile scripts/ci/phase10_static_checks.py

  unit-and-tooling-tests:
    name: JVM unit tests and Tooling API suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout complete source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-phase10-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-phase10-gradle-
            ${{ runner.os }}-gradle-
      - name: Run app unit tests and Tooling API build/tests
        run: ./gradlew :core:app:testDebugUnitTest :tooling:impl:build --continue --stacktrace
        env:
          ANDROIDIDE_TEST: 'true'
          TEST_TOOLING_API_IMPL: 'true'
      - name: Preserve test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

  debug-apk:
    name: Build and fingerprint debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout complete source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-phase10-apk-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-phase10-apk-
            ${{ runner.os }}-gradle-
      - name: Assemble debug APKs only
        run: ./gradlew :core:app:assembleDebug --stacktrace
      - name: Verify APK outputs and write SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find core/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          mkdir -p build
          find core/app/build/outputs/apk -type f -name '*.apk' -print0 \
            | sort -z \
            | xargs -0 sha256sum > build/phase10-apk-sha256.txt
          cat build/phase10-apk-sha256.txt
      - name: Upload debug APKs and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-debug-apks
          if-no-files-found: warn
          path: |
            core/app/build/outputs/apk/**/*.apk
            build/phase10-apk-sha256.txt

# Deliberately absent: release signing, Maven publishing, snapshot publishing, and device-pass claims.
